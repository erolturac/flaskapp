{% extends "base.html" %}
{% block title %}Home | Leman Sarıkaya{% endblock %}
{% block content %}
    <div class="hero">
        <h1>Welcome</h1>
        {% if session.get('user_id') %}
            <p>You are logged in as <strong>{{ session.get('username') }}</strong>.</p>
            <a class="btn" href="{{ url_for('dashboard') }}">Go to Dashboard</a>
        {% else %}
            <p>Brand Consistency</p>
            <div class="hero-actions">
                <a class="btn" href="{{ url_for('login') }}">Login</a>
                <a class="btn btn-secondary" href="{{ url_for('register') }}">Register</a>
            </div>
        {% endif %}
    </div>
{% endblock %}
